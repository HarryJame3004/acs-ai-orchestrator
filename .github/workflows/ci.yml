name: Cloud baseline regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned development dependencies
        run: bash scripts/cloud_setup.sh
      - name: Lint, type check and offline secret candidate regression
        run: .venv/bin/python scripts/cloud_static.py --report /tmp/acs-static.json
      - name: Original baseline coverage and zero current test failures
        if: ${{ !cancelled() }}
        run: .venv/bin/python scripts/cloud_test.py --compare-baseline --report /tmp/acs-tests.json
      - name: Offline Git history candidate regression
        if: ${{ !cancelled() }}
        run: .venv/bin/python scripts/security_scan.py --history --report /tmp/acs-history.json
      - name: Show actual check outcomes
        if: ${{ always() }}
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          for name in ('/tmp/acs-static.json', '/tmp/acs-tests.json'):
              path = Path(name)
              if path.exists():
                  data = json.loads(path.read_text())
                  print(name, json.dumps({k: v for k, v in data.items() if k != 'tests'}))
          PY
